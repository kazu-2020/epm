profile = "mutants"
exclude_re = [
    "<impl fmt::Display for DimensionError>::fmt",
    "<impl fmt::Debug for Attribute",
    "<impl fmt::Display for MeasureError>::fmt",
    # Not tested: a constant hash keeps every lookup correct and only makes it slow.
    "replace hash_coordinate -> u64",
    # Not tested: these turn the binary search into an endless loop, and cargo-mutants reports the timeout as a failure that turns CI red.
    "replace < with <= in Measure::search",
    "replace \\+ with [-*] in Measure::search",
]
# Not mutated: datagen is a test tool, not engine code. A datagen mutant mostly changes which data is generated, which no test can tell apart.
exclude_globs = ["datagen/**"]
