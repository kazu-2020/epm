profile = "mutants"
exclude_re = [
    "<impl fmt::Display for DimensionError>::fmt",
    "<impl fmt::Debug for (Text|Reference)Attribute",
    "<impl fmt::Display for MeasureError>::fmt",
    "<impl fmt::Display for EvaluateError>::fmt",
    # Not tested: these keep a cursor at 0, so the merge loop never ends and grows its key buffer until the CI runner runs out of memory.
    "replace \\+= with \\*= in (merge|merge_changes|(Columns::)?changes_from)",
    # Not tested: these only choose a slower path (sort, filter or binary search) that builds the same cells.
    "replace is_normalized -> bool with false",
    "replace == with != in is_normalized",
    "replace dense_strides -> Option<\\(usize, Vec<usize>\\)> with None",
    "replace >= with < in union$",
    "replace <= with > in dense_strides",
    "column_engine/src/columns.rs:[0-9]+:[0-9]+: replace << with >>",
    # Not tested: with one owner both paths add the same rows in the same order.
    "replace == with != in Columns::sum",
    # Not tested: these only read more cells than the region needs, and the old and new cells outside it are equal.
    "replace == with != in apply",
    "replace searched -> bool",
    "replace <= with > in searched",
    "replace match guard searched\\(members\\) with (true|false) in (Columns::)?narrow",
    # Not tested: the arms are equivalent here. Equal keys take the arm before, and the axes of a key never overlap, so | and ^ give the same key.
    "replace < with <= in merge$",
    "replace \\| with \\^ in KeyLayout::pack",
    # Not tested: these only read more cells than the region needs, and restrict at the end keeps the same cells.
    "replace Evaluator<[^>]*>::source_region -> Result<Region, EvaluateError> with Ok\\(Default::default\\(\\)\\)",
    "replace Evaluator<[^>]*>::operand_region -> Result<Region, EvaluateError> with Ok\\(Default::default\\(\\)\\)",
    "delete match arm CheckedNode::(Filter|Sum).* in Evaluator<[^>]*>::operand_region",
    # Not tested: these only turn off the cache of shared subexpressions, so each use computes the same cells again.
    "replace > with (==|<|>=) in evaluate_in",
    "replace operands -> Vec<&CheckedNode> with vec!\\[\\]",
    "replace Evaluator<[^>]*>::count_uses -> Result<\\(\\), EvaluateError> with Ok\\(\\(\\)\\)",
    "replace \\+= with \\*= in Evaluator<[^>]*>::count_uses",
    "replace > with (<|>=) in Evaluator<[^>]*>::node",
    # Not tested: a capacity hint only changes how much memory is reserved, so no test sees it.
    "replace \\+ with [-*] in Measure::compact",
]
# Not mutated: bench, datagen and oracle are tools, not engine code. No test can tell datagen mutants apart, each oracle mutant relinks DuckDB and reruns the property test, and bench only drives the engines.
exclude_globs = ["bench/**", "datagen/**", "oracle/**"]
