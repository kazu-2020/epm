[package]
name = "server"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
apply_before_commit = []
skip_commit = []
apply_twice = []
swap_commits = []
no_admission_check = []
snapshot_start_after = []
snapshot_without_request_ids = []
snapshot_ahead = []

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
as_conversions = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
buffa = { version = "0.9.2", features = ["json"] }
buffa-types = { version = "0.9.2", features = ["json"] }
bytes = "1.12.1"
change_log = { path = "../storage/change_log" }
connectrpc = { version = "0.9.1", default-features = false, features = ["axum", "json"] }
datagen = { path = "../compute_engine/datagen" }
dimension = { path = "../compute_engine/dimension" }
formula = { path = "../compute_engine/formula" }
measure = { path = "../compute_engine/measure" }
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
rayon = "1.12.0"
serde = "1.0.229"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std", "tracing-log"] }
ulid = "3.0.0"
workspace = { path = "../compute_engine/workspace" }
zstd = "0.14.3"

[dev-dependencies]
async-trait = "0.1.92"
column_engine = { path = "../compute_engine/column_engine" }
futures-util = "0.3.34"
oracle = { path = "../compute_engine/oracle" }
serde_json = "1.0.154"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tokio = { version = "1.54.1", features = ["rt", "test-util", "time"] }

[profile.dev.package."*"]
opt-level = 1

[build-dependencies]
connectrpc-build = "0.9.0"
prost = "0.14.6"
protox = "0.10.0"
