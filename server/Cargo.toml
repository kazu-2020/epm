[package]
name = "server"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
apply_before_commit = []
skip_commit = []
apply_twice = []
swap_commits = []
no_admission_check = []
snapshot_start_after = []
snapshot_without_request_ids = []
snapshot_ahead = []

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1.12.1"
change_log = { path = "../storage/change_log" }
column_engine = { path = "../compute_engine/column_engine" }
datagen = { path = "../compute_engine/datagen" }
dimension = { path = "../compute_engine/dimension" }
evaluator = { path = "../compute_engine/evaluator" }
formula = { path = "../compute_engine/formula" }
measure = { path = "../compute_engine/measure" }
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
ulid = "3.0.0"
workspace = { path = "../compute_engine/workspace" }
zstd = "0.13.4"

[dev-dependencies]
async-trait = "0.1.92"
futures-util = "0.3.34"
oracle = { path = "../compute_engine/oracle" }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tokio = { version = "1.54.1", features = ["rt", "test-util", "time"] }

[profile.dev.package."*"]
opt-level = 1
