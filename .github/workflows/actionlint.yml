name: actionlint

on:
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  pull_request:
    paths: [".github/workflows/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: rhysd/actionlint:1.7.12
      # The image runs as guest, and the runner writes its files in /__w as root.
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image has no git, so checkout makes no .git and actionlint cannot find the workflows by itself.
      - run: actionlint -color .github/workflows/*.y*ml
