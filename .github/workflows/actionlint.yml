name: actionlint

on:
  push:
    branches: [main]
    paths: [".github/workflows/**", ".github/actions/actionlint/**"]
  pull_request:
    paths: [".github/workflows/**", ".github/actions/actionlint/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not container: image: the docker ecosystem of Dependabot reads only Dockerfiles, so the image tag lives in one.
      - uses: ./.github/actions/actionlint
