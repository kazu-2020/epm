name: shellcheck

on:
  push:
    branches: [main]
    paths: ["**/*.sh", ".github/workflows/shellcheck.yml"]
  pull_request:
    paths: ["**/*.sh", ".github/workflows/shellcheck.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck
