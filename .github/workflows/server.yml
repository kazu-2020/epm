name: server

on:
  push:
    branches: [main]
    paths: ["server/**", "storage/change_log/**", "storage/rustfs/compose.yaml", "compute_engine/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "storage/change_log/**", "storage/rustfs/compose.yaml", "compute_engine/**", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ENDPOINT: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: demo
      AWS_SECRET_ACCESS_KEY: demo-secret
      AWS_REGION: us-east-1
      AWS_ALLOW_HTTP: "true"
      EPM_S3_BUCKET: epm-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: docker compose -f ../storage/rustfs/compose.yaml up -d
      - name: Create the bucket
        timeout-minutes: 2
        run: until aws --endpoint-url "$AWS_ENDPOINT" s3 mb "s3://$EPM_S3_BUCKET"; do sleep 2; done
      - run: ./demo.sh
