name: s3-latency

on:
  workflow_dispatch:
    inputs:
      instance:
        description: Instance type
        type: choice
        options: [r7i.2xlarge, r7i.16xlarge]
        default: r7i.2xlarge
      minutes:
        description: Minutes before the instance stops itself (30 to 90)
        default: "60"

permissions:
  contents: read

concurrency: bench

jobs:
  measure:
    uses: ./.github/workflows/ec2.yml
    permissions:
      contents: read
      id-token: write
    with:
      name: s3-latency
      files: storage/s3/latency.py storage/s3/requirements.txt
      script: storage/s3/ec2.sh
      summary: storage/s3/summary.sh
      instance: ${{ inputs.instance }}
      minutes: ${{ inputs.minutes }}
      wait-minutes: 100
      job-minutes: 120
