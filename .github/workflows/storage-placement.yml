name: storage-placement

on:
  push:
    branches: [main]
    paths: ["storage/placement/**", "storage/postgres/compose.yaml", ".github/workflows/storage-placement.yml"]
  pull_request:
    paths: ["storage/placement/**", "storage/postgres/compose.yaml", ".github/workflows/storage-placement.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: storage/placement

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLACEMENT_TEST_PGBOUNCER_URL: postgres://postgres@127.0.0.1:56433/epm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: storage/placement
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: docker compose -f ../postgres/compose.yaml up -d --wait
      - name: Apply the migration
        run: psql -v ON_ERROR_STOP=1 -f migrations/0001_placement.sql postgres://postgres@127.0.0.1:55433/epm
      - run: cargo test --locked
