name: bench

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to measure (empty means the selected branch)
        required: false
      baseline:
        description: Commit to measure next to it in the same run (empty means none)
        required: false
      instance:
        description: Instance type
        type: choice
        options: [r7i.2xlarge, r7i.16xlarge]
        default: r7i.2xlarge
      scales:
        description: Multiples of the quantity cells of the representative model, separated by spaces (1 is about 100 million cells in all, and also runs hyperfine and edit)
        default: "1"
      minutes:
        description: Minutes before the instance stops itself (30 to 140)
        default: "90"
      volume:
        description: Disk size in GB
        default: "30"

permissions:
  contents: read

concurrency: bench

jobs:
  # Not in the measure job: a build of any SHA runs its build scripts, and they must not reach the OIDC token.
  build:
    # Not ubuntu-latest: the binaries must link against the glibc of the Ubuntu 24.04 AMI.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - working-directory: compute_engine
        run: |
          cargo build --release --locked -p bench
          mkdir -p ../bin/new
          cp target/release/generate target/release/recalculate target/release/edit ../bin/new/
          gcc -O2 -pthread -o ../bin/new/stream bench/ec2/stream.c
      - if: inputs.baseline != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.baseline }}
          path: baseline
          persist-credentials: false
      - if: inputs.baseline != ''
        working-directory: baseline/compute_engine
        run: |
          cargo build --release --locked -p bench
          mkdir -p ../../bin/baseline
          cp target/release/recalculate ../../bin/baseline/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin
          path: bin/
          retention-days: 1
          if-no-files-found: error

  measure:
    needs: build
    runs-on: ubuntu-24.04
    environment: bench
    timeout-minutes: 170
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      BUCKET: ${{ vars.BENCH_BUCKET }}
      RUN: ${{ github.run_id }}-${{ github.run_attempt }}
      INSTANCE_TYPE: ${{ inputs.instance }}
      SCALES: ${{ inputs.scales }}
      MINUTES: ${{ inputs.minutes }}
      VOLUME: ${{ inputs.volume }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$SCALES" =~ ^[1-9][0-9]*( [1-9][0-9]*)*$ ]] || exit 1
          [[ "$MINUTES" =~ ^[1-9][0-9]*$ ]] || exit 1
          [ "$MINUTES" -ge 30 ] && [ "$MINUTES" -le 140 ] || exit 1
          [[ "$VOLUME" =~ ^[1-9][0-9]*$ ]] || exit 1
          [ "$VOLUME" -ge 30 ] && [ "$VOLUME" -le 500 ] || exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin
          path: bin
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 10800
      - name: Upload the binaries
        run: |
          aws s3 cp --recursive bin/ "s3://$BUCKET/bin/$RUN/"
      - name: Start the instance
        run: |
          script=compute_engine/bench/ec2/measure.sh
          {
            head -n 1 "$script"
            echo "BUCKET=$BUCKET"
            echo "RUN=$RUN"
            echo "MINUTES=$MINUTES"
            echo "export SCALES='$SCALES'"
            tail -n +2 "$script"
          } > user-data.sh
          aws ec2 run-instances \
            --launch-template 'LaunchTemplateName=bench,Version=$Latest' \
            --instance-type "$INSTANCE_TYPE" \
            --block-device-mappings "DeviceName=/dev/sda1,Ebs={VolumeSize=$VOLUME,VolumeType=gp3,DeleteOnTermination=true,Encrypted=true}" \
            --user-data file://user-data.sh \
            --query 'Instances[0].[InstanceId,ImageId,InstanceType]' --output text > instance.txt
          read -r instance image type < instance.txt
          echo "INSTANCE=$instance" >> "$GITHUB_ENV"
          echo "Instance $instance, $type, AMI $image" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Wait for the results
        timeout-minutes: 150
        run: |
          done_key="results/$RUN/exit-code"
          until aws s3api head-object --bucket "$BUCKET" --key "$done_key" > /dev/null 2>&1; do
            state=$(aws ec2 describe-instances --instance-ids "$INSTANCE" --query 'Reservations[0].Instances[0].State.Name' --output text || true)
            if [ "$state" = terminated ] && ! aws s3api head-object --bucket "$BUCKET" --key "$done_key" > /dev/null 2>&1; then
              echo "::error::The instance ended without results"
              exit 1
            fi
            sleep 30
          done
          aws s3 cp --recursive "s3://$BUCKET/results/$RUN/" out/
      - name: Write the summary
        run: |
          {
            echo '## recalculate'
            cat out/recalculate.md || true
            echo
            grep -E 'Maximum resident set size|Elapsed' out/recalculate-time.txt || true
            echo
            echo '## edit'
            echo '```'
            cat out/edit.txt || true
            echo '```'
            echo
            echo '## threads'
            echo '```'
            cat out/stream.txt || true
            grep -H 'recalculated' out/scale-*/*.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$(cat out/exit-code)"
      - if: always() && env.INSTANCE != ''
        name: Terminate the instance
        run: aws ec2 terminate-instances --instance-ids "$INSTANCE" > /dev/null
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ env.RUN }}
          path: out/
          if-no-files-found: ignore
