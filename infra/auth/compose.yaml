services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - ./epm-realm.json:/opt/keycloak/data/import/epm-realm.json:ro
      - ./customer-realm.json:/opt/keycloak/data/import/customer-realm.json:ro
