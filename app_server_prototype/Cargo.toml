[package]
name = "app_server_prototype"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
buffa = { version = "0.9.2", features = ["json"] }
buffa-types = { version = "0.9.2", features = ["json"] }
connectrpc = { version = "0.9.1", features = ["axum", "client"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["net", "rt", "time"] }

[build-dependencies]
connectrpc-build = "0.9.0"
prost = "0.14.6"
protox = "0.10.0"

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros"] }
