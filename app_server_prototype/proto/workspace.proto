syntax = "proto3";

package epm.v1;

import "google/protobuf/struct.proto";

service Workspace {
  rpc SubmitEdit(SubmitEditRequest) returns (SubmitEditResponse);
  rpc ReadCells(ReadCellsRequest) returns (ReadCellsResponse);
  rpc ListDefinitions(ListDefinitionsRequest) returns (ListDefinitionsResponse);
  rpc GetLag(GetLagRequest) returns (GetLagResponse);
}

message SubmitEditRequest {
  string request_id = 1;
  string measure = 2;
  repeated uint32 coordinate = 3;
  // Not optional double or DoubleValue: proto3 JSON reads null as an unset field, so a clear and a missing value would be the same.
  google.protobuf.Value value = 4;
}

message SubmitEditResponse {
  uint64 sequence = 1;
}

message ReadCellsRequest {
  optional uint64 at_least = 1;
  repeated Cell cells = 2;
}

message Cell {
  string measure = 1;
  repeated uint32 coordinate = 2;
}

message ReadCellsResponse {
  optional uint64 recalculated = 1;
  // Not repeated double: an element of a repeated scalar cannot be null.
  repeated google.protobuf.Value values = 2;
}

message ListDefinitionsRequest {}

message ListDefinitionsResponse {
  repeated Measure measures = 1;
  repeated Dimension dimensions = 2;
}

message Measure {
  string ulid = 1;
  string name = 2;
  repeated string axes = 3;
  string kind = 4;
}

message Dimension {
  string ulid = 1;
  string name = 2;
  repeated Member members = 3;
}

message Member {
  uint32 id = 1;
  string natural_key = 2 [json_name = "natural_key"];
}

message GetLagRequest {}

message GetLagResponse {
  optional uint64 committed = 1;
  optional uint64 recalculated = 2;
}
